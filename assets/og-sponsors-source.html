  chrome --headless --screenshot=assets/og-sponsors.png --window-size=1200,630 \
    --force-device-scale-factor=2 --hide-scrollbars --virtual-time-budget=6000 assets/og-sponsors-source.html -->
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  --paper:#f2f1ea; --card:#fff; --ink:#1a1a15; --ink-2:#3a3a32; --muted:#6c6b61; --faint:#9d9b8f;
  --line:#e7e5db; --line-strong:#d8d6ca;
  --active:#137244; --active-bg:#e6f1ea; --active-brd:#bfe0cd;
  --hl:#cbe8d6;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --sans:"IBM Plex Sans",-apple-system,sans-serif;
  background:var(--paper);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}
</style>
<style>
.wrap{position:absolute;inset:0;padding:64px 72px;display:flex;flex-direction:column}
.bm{font-family:var(--mono);font-weight:600;font-size:28px}
.bm .sub{color:var(--muted);font-weight:400}
h1{font-size:60px;font-weight:700;letter-spacing:-.025em;line-height:1.12;margin-top:26px;max-width:22ch}
h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--hl) 62%);padding:0 .04em}
.tbl{margin-top:38px;background:var(--card);border:1px solid var(--line-strong);border-radius:6px;overflow:hidden}
.row{display:flex;align-items:baseline;gap:26px;padding:16px 30px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.rank{font-family:var(--mono);font-size:22px;color:var(--faint);width:52px}
.co{font-size:27px;font-weight:600}
.n{font-family:var(--mono);font-size:19px;color:var(--muted);margin-left:auto}
.bar{height:10px;background:var(--active);opacity:.85;border-radius:2px}
.foot{margin-top:auto;display:flex;justify-content:space-between;
  font-family:var(--mono);font-size:19px;color:var(--muted)}
</style>
<div class="wrap">
  <div class="bm">foropensource<span class="sub"> &middot; the open-source offer registry</span></div>
  <h1>Which companies sponsor the most open source?</h1>
  <div class="tbl">
    <div class="row"><span class="rank">#1</span><span class="co">CodeRabbit</span><div class="bar" style="width:330px"></div><span class="n">99 sponsored</span></div>
    <div class="row"><span class="rank">#2</span><span class="co">OpenAI</span><div class="bar" style="width:167px"></div><span class="n">50 sponsored</span></div>
    <div class="row"><span class="rank">#3</span><span class="co">Sentry</span><div class="bar" style="width:100px"></div><span class="n">30 sponsored</span></div>
  </div>
  <div class="foot"><span>36 companies &middot; 353 public sponsorships</span><span>foropensource.com/sponsors</span></div>
</div>
